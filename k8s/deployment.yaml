apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-demo
  namespace: enterprise-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-demo
  template:
    metadata:
      labels:
        app: enterprise-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example.com/team/enterprise-demo:1.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
