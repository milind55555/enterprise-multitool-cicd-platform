stages: [test, quality, security, package, publish, deploy]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE_TAG: "$CI_COMMIT_SHA"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key: maven-$CI_COMMIT_REF_SLUG
  paths: [.m2/repository]

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd app && mvn -B -ntp clean verify
  artifacts:
    when: always
    reports:
      junit: app/target/surefire-reports/TEST-*.xml
    paths: [app/target/enterprise-demo.jar]
    expire_in: 7 days

sonarqube:
  stage: quality
  image: maven:3.9-eclipse-temurin-17
  needs: [test]
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'
  script:
    - cd app && mvn -B -ntp verify sonar:sonar
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey=enterprise-demo

trivy_fs:
  stage: security
  image: aquasec/trivy:0.58.1
  needs: [test]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed .
  allow_failure: false

container_build:
  stage: package
  image: docker:27-cli
  services: [docker:27-dind]
  needs: [test, trivy_fs]
  script:
    - docker build --pull -t "$IMAGE_NAME" .
    - docker save "$IMAGE_NAME" -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

trivy_image:
  stage: security
  image: aquasec/trivy:0.58.1
  needs: [container_build]
  script:
    - trivy image --input image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed

publish_image:
  stage: publish
  image: docker:27-cli
  services: [docker:27-dind]
  needs: [container_build, trivy_image]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker load -i image.tar
    - docker push "$IMAGE_NAME"

deploy_staging:
  stage: deploy
  image: alpine/helm:3.16.3
  needs: [publish_image]
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - apk add --no-cache kubectl
    - test -n "$KUBE_CONFIG_B64"
    - mkdir -p "$HOME/.kube"
    - echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
    - chmod 600 "$HOME/.kube/config"
  script:
    - helm upgrade --install enterprise-demo ./helm/enterprise-demo
      --namespace "${KUBE_NAMESPACE:-enterprise-demo}" --create-namespace
      --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHA"
      --wait --timeout 180s
    - ./scripts/smoke-test.sh "${APP_URL}"
  after_script:
    - rm -f "$HOME/.kube/config"
